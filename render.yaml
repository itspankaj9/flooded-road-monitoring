services:
  - type: web
    name: smart-infrastructure-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_OPENWEATHER_API_KEY
        sync: false
      - key: VITE_MAPBOX_TOKEN
        sync: false
      - key: VITE_API_KEY
        sync: false
